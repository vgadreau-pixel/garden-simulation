<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jardin des Saisons</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87b56a;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 238px; /* à droite du panneau catalogue (218px + marges) */
        z-index: 10;
        background: rgba(20, 30, 15, 0.65);
        color: #eaf3df;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.5;
        user-select: none;
        pointer-events: none;
      }
      #hud .title {
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      #fps.good { color: #9fe670; }
      #fps.warn { color: #f2c14e; }

      /* ── Barre de contrôle du temps ── */
      #timebar {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(24, 34, 18, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 8px 14px;
        color: #eaf3df;
        font-size: 13px;
        user-select: none;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }
      #timebar .tbtn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #eaf3df;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12.5px;
        cursor: pointer;
        transition: background 0.15s ease;
        white-space: nowrap;
      }
      #timebar .tbtn:hover { background: rgba(255, 255, 255, 0.18); }
      #timebar .tbtn.active {
        background: #7da24c;
        border-color: #9fc06c;
        color: #fff;
      }
      #timebar .tsep {
        width: 1px;
        align-self: stretch;
        background: rgba(255, 255, 255, 0.16);
        margin: 0 2px;
      }
      #dateslider {
        width: min(320px, 34vw);
        accent-color: #9fc06c;
        cursor: pointer;
      }
      #hint-mode {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%) translateY(-6px);
        z-index: 30;
        background: rgba(24, 34, 18, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #eaf3df;
        border-radius: 10px;
        padding: 7px 14px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
      }
      #hint-mode.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
      #datelabel {
        min-width: 210px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #datelabel.s-printemps { color: #b8e986; }
      #datelabel.s-ete { color: #ffd97a; }
      #datelabel.s-automne { color: #ffb066; }
      #datelabel.s-hiver { color: #a8d4ff; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div class="title">Jardin des Saisons</div>
      <div>Glisser : d&eacute;placer &middot; Molette : zoom &middot; V : vue immersive</div>
      <div>FPS : <span id="fps" class="good">--</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
